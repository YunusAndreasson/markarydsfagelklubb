# Weekly, grouped so a week's updates arrive as a few pull requests. Each one
# runs CI; merge it when it's green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    ignore:
      # eslint-config-expo lints through typescript-eslint, which doesn't support
      # TypeScript 7 (the native compiler) yet: typescript-eslint/typescript-eslint#10940.
      # Lift this once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 dropped context.getFilename(), which eslint-plugin-react (inside
      # eslint-config-expo) still calls, so every lint fails. Lift this once
      # eslint-config-expo supports 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Expo pins React Native and its native modules to each SDK. A new SDK
      # is an upgrade done by hand (`npm run deps:update:latest`, then
      # `npx expo install --fix`), not a version bump.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "eslint-config-expo", "react", "react-dom", "@types/react", "react-native", "react-native-*"]
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

name: Bug report
description: Something in the app doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what the app did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open Larm …
        2. Tap …
  - type: input
    id: version
    attributes:
      label: App version
      description: In Profil, at the bottom.
      placeholder: 1.1.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone 15 on iOS 26.1, or Pixel 8 on Android 16
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: >
        If it helps. The app shows other members' names, reports and phone
        numbers, so crop out anything that isn't part of the problem.

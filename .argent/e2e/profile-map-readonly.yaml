executionPrerequisite: Signed-in QA session on Larm, connected to Metro 8081; no other profiler active. First run before visiting Lokaler, second run after returning. Never submits.
steps:
  - tool: react-profiler-start
    args: { device_id: emulator-5554, port: 8081, sample_interval_us: 1000 }
  - tool: native-profiler-start
    args: { device_id: emulator-5554 }
  - run: perf-map-first-visit.yaml
  - tool: react-profiler-stop
    args: { device_id: emulator-5554, port: 8081 }
  - tool: native-profiler-stop
    args: { device_id: emulator-5554 }
  - tool: react-profiler-analyze
    args:
      device_id: emulator-5554
      port: 8081
      platform: android
      project_root: /home/yunus/Work/mafk-mobie
      rn_version: 0.88.1
  - tool: native-profiler-analyze
    args: { device_id: emulator-5554 }
  - tool: profiler-combined-report
    args: { device_id: emulator-5554, port: 8081 }

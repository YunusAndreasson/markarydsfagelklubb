steps:
  - tap:
      text: 'Rapporterad av'
      role: Button
  - await:
      idle: true
  - tool: button
    args:
      button: back
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.8
      toX: 0.5
      toY: 0.3
      durationMs: 500
      momentum: false
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.3
      toX: 0.5
      toY: 0.8
      durationMs: 500
      momentum: false
executionPrerequisite: Signed in, Larm feed at the top, so the first report's
  card is the one tapped. Read-only flow; never submit a report.
